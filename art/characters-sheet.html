<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glitch Chess — Character Samples 01</title>
<style>
  body { background:#111318; color:#e8e8f0; font-family:"Avenir Next",system-ui,sans-serif; padding:32px; }
  h1 { font-size:20px; letter-spacing:2px; margin-bottom:4px; }
  .sub { color:#8a8fa8; font-size:13px; margin-bottom:28px; max-width:80ch; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; max-width:1500px; }
  @media (max-width:1100px){ .grid { grid-template-columns:repeat(2,1fr);} }
  figure img { width:100%; border-radius:6px; display:block; box-shadow:0 4px 24px rgba(0,0,0,.5); }
  figcaption { font-size:12px; color:#8a8fa8; padding:8px 2px; line-height:1.5; }
  figcaption b { color:#e8e8f0; font-size:13px; display:block; }
  .keep { color:#7dff9b; } .redo { color:#ffb46b; }
</style>

<body>
<h1>CHARACTER SAMPLES 01</h1>
<div class="sub">Two per faction. Working verdicts inline — the emerging rule: characters that keep the <em>chess-piece silhouette</em> (Solder, Fermata, the Docent) land; characters that drift fully human (Pip, Vesper) lose the game's DNA.</div>
<div class="grid">
  <figure><img src="output/char-pip-1784932881487.png"><figcaption><b>Pip — Marginalia pawn</b><span class="redo">REDO:</span> went chibi + human; she should be an actual pawn. Crown-ghost concept works.</figcaption></figure>
  <figure><img src="output/char-docent-1784932887734.png"><figcaption><b>The Docent — Marginalia bishop</b><span class="keep">KEEP:</span> owl librarian with scroll pockets and moths. Warm, wise, exactly the register.</figcaption></figure>
  <figure><img src="output/char-volt-1784932894247.png"><figcaption><b>Volt — Glitchwrights knight</b><span class="redo">CLOSE:</span> great energy/colors; grin reads slightly villainous, body oddly humanoid. Re-brief toward piece-body.</figcaption></figure>
  <figure><img src="output/char-solder-1784932901384.png"><figcaption><b>Solder — Glitchwrights pawn</b><span class="keep">KEEP:</span> pawn-shaped body + taped-can jetpack + pure joy. The template for how characters should work.</figcaption></figure>
  <figure><img src="output/char-colossus-1784932907775.png"><figcaption><b>The Colossus — Errantry knight</b><span class="redo">REDO:</span> horse-headed humanoid is uncanny; the bake-off's knight-piece monument body was right. Keep the offered hand + tiny archivist.</figcaption></figure>
  <figure><img src="output/char-vesper-1784932914231.png"><figcaption><b>Vesper — Errantry bishop</b><span class="redo">REDO:</span> lovely, but became a human wizard — zero chess DNA. Needs a bishop-piece body mid-stride.</figcaption></figure>
  <figure><img src="output/char-quietqueen-1784932920762.png"><figcaption><b>The Quiet Queen — Hush</b><span class="keep">KEEP (borderline):</span> gorgeous papercraft, dissolving foil cloak. Face is human — test a queen-piece version before locking.</figcaption></figure>
  <figure><img src="output/char-fermata-1784932927753.png"><figcaption><b>Fermata — Hush pawn</b><span class="keep">KEEP — best in show:</span> newsprint pawn, scarf, red heart, the void curling around her… and her shadow is a running girl.</figcaption></figure>
</div>
</body>
